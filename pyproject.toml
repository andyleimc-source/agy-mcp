[project]
name = "agy-mcp"
version = "0.2.0"
description = "MCP server wrapping Google Antigravity CLI (agy) — use Antigravity from any MCP client, billed against your Google AI subscription."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andy Lei", email = "andylei.mc@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "antigravity", "gemini", "google", "ai", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.scripts]
agy-mcp = "agy_mcp.server:main"
agq = "agy_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/andyleimc-source/agy-mcp"
Issues = "https://github.com/andyleimc-source/agy-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agy_mcp"]
